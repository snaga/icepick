[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icepick"
version = "0.1.0"
description = "Deterministic AST-based query optimizer and anti-pattern linter for Snowflake SQL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Icepick Team" }
]
dependencies = [
    "sqlglot>=30.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
icepick = "icepick.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/icepick"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
per-file-ignores = { "src/icepick/cli.py" = ["B008"] }

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
